# .stratum/policy.yml: every key with its default.
# It's read from the default branch, so a PR can't change the rules it's judged by.
#
# Copy only the keys you want to change. A key you set is fixed: the profile
# (review.profile: auto) no longer adjusts it for your model. The values marked
# "profile" below are the small profile's; the large profile changes them.
version: 1

review:
  model: local                 # local | hosted
  endpoint: http://localhost:11434/v1   # any OpenAI-compatible server; this is Ollama's
  model_name: ""               # empty = qwen2.5-coder:7b
  profile: auto                # auto | small | large; auto picks from the model's size (up to ~20B is small)
  context_tokens: 16384        # profile: the model's context window; big diffs are split to fit it (large: 32768)
  max_chunks: 3                # model calls per review at most
  diff_format: interleaved     # profile: interleaved | split (large: split)
  large_patch: clip            # clip | skip a file too big for one model call
  context_lines: 0             # profile: unchanged lines shown around each hunk, read from the file (large: 10)
  context_callers: 0           # Python: up to this many calls of each function the PR changes, from elsewhere in the repository,
                               #   shown under the diff; only calls certain to be that function (imports followed, no guessing); needs a checkout
  mode: general                # general | security | performance | maintainability: what the per-file passes put first
  file_reviews: 0              # profile: files reviewed one at a time before the chunked review (large: 15)
  lens_files: 0                # profile: of those, how many get a focused pass per lens of the mode (large: 5)
  walkthrough: false           # profile: one more call for a summary, priorities and a walkthrough (large: true)
  parallel_calls: 1            # profile: model calls at once in the per-file passes (large: 4)
  max_inline_comments: 12
  quiet: false                 # true posts less of what the model says, and keeps it apart from what the checks found:
                               #   a claim it repeats on three or more files is one finding; comments that name no defect are left out
                               #   (missing docs, style, praise, a "Potential ..." guess unless it's about security); at most 5 of its findings are in view, the rest folded;
                               #   the summary counts the checks' findings and the model's apart, and shows 3 of the history notes
  min_severity: medium         # the model's findings below this aren't shown (low | medium | high | critical); the checks' always are
  verify: none                 # none | strict | lenient: one more short call per model finding, asking the model whether it's a real defect.
                               #   strict: for models up to about 8B, which can't tell (cuts their wrong comments by ~60%);
                               #   lenient: for 14B-class models, which can (keeps their real catches, drops ~30% of the wrong ones)
  reasoning: default           # default | low | off: how long a thinking model (gpt-oss, Qwen3) thinks first; on a CPU, `low` leaves room for the answer
  logic_pass: false            # true adds one call per chunk that looks only for logic errors (a condition the wrong way round, an off-by-one,
                               #   `and` for `or`), working through the added lines that make a decision one at a time
                               #   With `context_lines: 10`, `gpt-oss:20b` found 27 of 39 planted bugs against 18 without both; a review takes 2-4x as long
  rules: []                    # your own review rules in plain words, e.g. "Every SQL query is parameterized."
  ignore_paths: ["**/*.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/go.sum",
                 "**/*.min.js", "**/*.min.css", "**/*.map", "**/*.svg", "**/*.snap",
                 "**/vendor/**", "**/node_modules/**", "**/dist/**",
                 ".github/**"]   # never sent to the model; the checks still read them
  log_prompts: false           # true keeps prompts and replies in the job log for 14 days
  check_name: Stratum          # the check run's name, as your branch protection requires it
  conclusion: severity         # severity: a critical finding fails, a high one is neutral | score: by risk score
  fail_at: 70                  # with conclusion: score, a risk score at or above this fails the check
  warn_at: 50                  # ... and at or above this is neutral
  events: [opened, synchronize, reopened, ready_for_review]   # PR events that start a review
  skip_drafts: true
  skip_bots: false             # true skips PRs opened by bots (dependabot and the like)
  skip_authors: []             # logins whose PRs aren't reviewed
  skip_labels: []              # PRs with any of these labels aren't reviewed
  skip_branches: []            # globs, e.g. ["release/**"]: PRs from these branches aren't reviewed

checks:
  bandit_low: false            # profile: keep Bandit's low-severity results too (large: true)
  heuristics: false            # profile: a finding per file in a risky area (auth, migrations, CI, dependencies) and for weakened tests (large: true)
  ruff: false                  # true reports errors Ruff finds on added Python lines (an undefined name, a format string that raises); needs Ruff installed (the ruff extra)
  floating_promises: false     # true flags, in JavaScript and TypeScript, a call left unawaited in an async function when the file awaits it elsewhere;
                               #   needs the `js` extra, which installs the parser (tree-sitter)
  weakened_tests: false        # true reports, on the line, a test a PR switches off, assertions it removes from a test, and a tolerance it widens
  unknown_names: false         # true flags, in Python, an import or a call of a name its module doesn't define (your own modules, and part of the standard library)
  removed_names: false         # true flags, in Python, a function, class or constant the PR removes from a module while another file still imports or uses it

commands:                      # who may run each /stratum command: anyone | author | write
  review: write                # "author" is the PR's author or anyone with write access
  ignore: write
  mute: write
  explain: author              # each explanation is a model call
  triage: anyone
  record: anyone

always_human:                  # matching PRs are labelled for a person and never closed
  paths: [".github/workflows/**", ".stratum/**"]
  new_dependencies: true

triage:
  enabled: false               # true lets Stratum add the labels below and close PRs
  labels:
    ready: "triage: ready"
    needs_work: "triage: needs work"
    low_effort: "triage: low effort"
    needs_human: "triage: needs a maintainer"
  label_low_effort: true
  require_linked_issue: false  # true labels PRs with no linked issue "needs work"
  close_without_issue: false   # true closes them, with a comment saying why

track_record:
  enabled: true                # each contributor can always see their own
  affects_triage: false        # true lets a record move a PR's label
  window_days: 180
  followup_days: 14
  exclude: []                  # logins or emails whose record is never built

dependencies:
  registry_lookup: true        # check how new an added package is
  min_package_age_days: 30     # younger packages are flagged
  known_vulnerabilities: false # true flags a dependency pinned to a version with published advisories; asks osv.dev, and needs registry_lookup

boundaries:                    # module rules; a PR that breaks one gets a finding
  modules: {}                  # e.g. {api: ["server/api/**"], db: ["server/db/**"]}
  forbid: []                   # e.g. ["api -> db: Go through the service layer."]: code in api must not import db; "*" is any module
  severity: medium             # a forbidden import's finding: low | medium | high | critical
  new_edges: off               # off | warn | fail: flag a module importing one it didn't on the default branch (low | high)

data:                          # GitHub App only
  findings_retention_days: 180

# services: is used by hosted Stratum's service map; Stratum Open ignores it.
# Names are the services of your Stratum project. Each key takes a name or a list.
# services:
#   web:
#     calls: [api]             # http
#   api:
#     uses: [db]               # database
#     publishes: [jobs]        # queue
#   worker:
#     consumes: [jobs]         # queue
