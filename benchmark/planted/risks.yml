# Risks planted for the checks that need no model. Each case is a set of new
# files a PR adds, and `rule` is what should catch it (any one of a list).
# Shaped after real incidents where there was one (`seen`). Nothing here is
# changed to make a case pass: a miss stays in as a miss. A case marked
# `control: true` is files its rule must leave alone.
#
# Secrets aren't stored here: `<<fake:kind>>` is replaced by a random value of
# that shape when the benchmark runs, so this file never holds anything a
# secret scanner would flag. `<<U+XXXX>>` is that Unicode character, so the
# hidden characters are visible here.

# ── secrets ──────────────────────────────────────────────────────────────

- id: secret-github-token
  rule: code/secret
  files:
    scripts/release.py: |
      import requests

      GITHUB_TOKEN = "<<fake:github-token>>"

      def create_release(tag):
          return requests.post(
              "https://api.github.com/repos/acme/app/releases",
              headers={"Authorization": f"token {GITHUB_TOKEN}"},
              json={"tag_name": tag},
          )

- id: secret-aws-key
  rule: code/secret
  seen: AWS keys pushed to public repos are found and used within minutes
  files:
    deploy/upload.py: |
      import boto3

      s3 = boto3.client(
          "s3",
          aws_access_key_id="<<fake:aws-key>>",
          aws_secret_access_key="<<fake:aws-secret>>",
      )

- id: secret-stripe-live
  rule: code/secret
  files:
    server/billing.js: |
      const stripe = require("stripe")("<<fake:stripe-key>>");

      module.exports = async function charge(customer, amount) {
        return stripe.charges.create({ customer, amount, currency: "usd" });
      };

- id: secret-slack-bot
  rule: code/secret
  files:
    ops/notify.py: |
      from slack_sdk import WebClient

      client = WebClient(token="<<fake:slack-token>>")

      def alert(text):
          client.chat_postMessage(channel="#ops", text=text)

- id: secret-google-api
  rule: code/secret
  files:
    web/src/maps.ts: |
      export const MAPS_URL =
        "https://maps.googleapis.com/maps/api/js?key=<<fake:google-key>>";

- id: secret-openai
  rule: code/secret
  files:
    app/llm.py: |
      from openai import OpenAI

      client = OpenAI(api_key="<<fake:openai-key>>")

- id: secret-private-key
  rule: code/secret
  files:
    deploy/deploy_key.pem: |
      <<fake:private-key>>

- id: secret-db-password
  rule: code/secret
  files:
    app/settings.py: |
      DATABASES = {
          "default": {
              "ENGINE": "django.db.backends.postgresql",
              "NAME": "shop",
              "USER": "shop",
              "PASSWORD": "<<fake:password>>",
              "HOST": "db.internal",
          }
      }

- id: secret-yaml-config
  rule: code/secret
  files:
    config/production.yml: |
      mailer:
        provider: sendgrid
        api_key: "<<fake:password>>"

# ── code that runs input ─────────────────────────────────────────────────

- id: eval-request
  rule: code/eval
  files:
    app/calc.py: |
      from flask import request

      def calculate():
          return str(eval(request.args["expr"]))

- id: exec-download
  rule: code/eval
  files:
    plugins/loader.py: |
      import requests

      def load_plugin(url):
          exec(requests.get(url).text)

- id: js-new-function
  rule: code/eval
  files:
    src/template.js: |
      export function compile(source) {
        return new Function("data", source);
      }

- id: shell-true
  rule: code/shell
  files:
    tools/thumbs.py: |
      import subprocess

      def thumbnail(filename):
          subprocess.run(f"convert {filename} -resize 64x64 thumb.png", shell=True, check=True)

- id: os-system
  rule: code/shell
  files:
    tools/unpack.py: |
      import os

      def unpack(archive):
          os.system(f"tar -xzf {archive} -C /tmp/unpacked")

- id: js-child-process
  rule: code/shell
  files:
    scripts/changelog.js: |
      const { exec } = require("child_process");

      module.exports = (branch, done) => exec(`git log --oneline ${branch}`, done);

- id: sql-fstring
  rule: code/sql
  files:
    app/users.py: |
      def find_user(cursor, name):
          cursor.execute(f"SELECT * FROM users WHERE name = '{name}'")
          return cursor.fetchone()

- id: sql-percent
  rule: code/sql
  files:
    app/sessions.py: |
      def end_session(cursor, sid):
          cursor.execute("DELETE FROM sessions WHERE id = '%s'" % sid)

- id: sql-concat-js
  rule: code/sql
  files:
    server/orders.js: |
      app.get("/orders/:id", (req, res) => {
        db.query("SELECT * FROM orders WHERE id = " + req.params.id, (err, rows) => res.json(rows));
      });

- id: cors-credentials
  rule: code/cors-any
  files:
    app/main.py: |
      from fastapi import FastAPI
      from fastapi.middleware.cors import CORSMiddleware

      app = FastAPI()
      app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True)

- id: cors-header
  rule: code/cors-any
  files:
    server/cors.js: |
      module.exports = (req, res, next) => {
        res.setHeader("Access-Control-Allow-Origin", "*");
        next();
      };

# ── Bandit (only when the `bandit` extra is installed) ───────────────────

- id: bandit-pickle
  rule: bandit/B301
  files:
    app/cache.py: |
      import pickle

      from flask import request

      def restore():
          return pickle.loads(request.data)

- id: bandit-yaml-load
  rule: bandit/B506
  files:
    app/config.py: |
      import yaml

      def read_config(path):
          with open(path) as handle:
              return yaml.load(handle, Loader=yaml.Loader)

- id: bandit-verify-false
  rule: bandit/B501
  files:
    app/webhook.py: |
      import requests

      def send(url, payload):
          return requests.post(url, json=payload, verify=False, timeout=10)

# ── GitHub workflows ─────────────────────────────────────────────────────

- id: wf-pwn-request
  rule: workflow/pwn-request
  seen: the "pwn request" pattern GitHub Security Lab describes; many projects
  files:
    .github/workflows/preview.yml: |
      name: Preview
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
            - run: npm ci && npm run build

- id: wf-branch-name-injection
  rule: [workflow/script-injection, workflow/pwn-request]
  seen: Ultralytics, December 2024 (a branch name ran code in a pull_request_target job)
  files:
    .github/workflows/format.yml: |
      name: Format
      on: pull_request_target
      jobs:
        format:
          runs-on: ubuntu-latest
          steps:
            - run: |
                git fetch origin ${{ github.head_ref }}
                git checkout ${{ github.head_ref }}

- id: wf-issue-title-injection
  rule: workflow/script-injection
  files:
    .github/workflows/triage.yml: |
      name: Triage
      on:
        issues:
          types: [opened]
      jobs:
        label:
          runs-on: ubuntu-latest
          steps:
            - run: echo "New issue: ${{ github.event.issue.title }}"

- id: wf-write-all
  rule: workflow/write-all
  files:
    .github/workflows/ci.yml: |
      name: CI
      on: [push, pull_request]
      permissions: write-all
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: make test

- id: wf-unpinned-third-party
  rule: workflow/unpinned-action
  seen: tj-actions/changed-files, March 2025 (its tags were moved to a malicious commit)
  files:
    .github/workflows/changed.yml: |
      name: Changed files
      on: pull_request
      jobs:
        changed:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: tj-actions/changed-files@v45
            - run: echo done

- id: wf-self-hosted-pr
  rule: workflow/self-hosted-pr
  seen: PyTorch, 2024 (self-hosted runners reachable from fork PRs)
  files:
    .github/workflows/gpu.yml: |
      name: GPU tests
      on: pull_request
      jobs:
        gpu:
          runs-on: [self-hosted, gpu]
          steps:
            - uses: actions/checkout@v4
            - run: pytest tests/gpu

- id: wf-write-on-target
  rule: [workflow/write-permission, workflow/pull-request-target]
  files:
    .github/workflows/label.yml: |
      name: Label
      on: pull_request_target
      permissions:
        contents: write
        pull-requests: write
      jobs:
        label:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/labeler@v5

