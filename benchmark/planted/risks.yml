# ── dependencies pinned to a version with advisories ─────────────────────
# The rule is off by default: run with
# --policy benchmark/planted/variants/known-vulnerabilities.yml.
# The answers come from the OSV database and change as advisories are
# published. The controls were clean on 2026-11-13: one that is flagged
# later may be a version that has got an advisory since.

- id: dep-vulnerable-requests
  rule: deps/vulnerable
  seen: CVE-2018-18074, requests before 2.20.0 kept the Authorization header on a redirect from https to http
  files:
    requirements.txt: |
      requests==2.19.1

- id: dep-vulnerable-pyyaml
  rule: deps/vulnerable
  seen: CVE-2020-1747, PyYAML before 5.3.1 could run code from a YAML file read with full_load
  files:
    pyproject.toml: |
      [project]
      name = "shop"
      dependencies = [
          "PyYAML==5.3",
      ]

- id: dep-vulnerable-lodash
  rule: deps/vulnerable
  seen: CVE-2020-8203, prototype pollution in lodash's zipObjectDeep
  files:
    package.json: |
      {
        "name": "web",
        "dependencies": {
          "lodash": "4.17.15"
        }
      }

- id: dep-vulnerable-event-stream
  rule: deps/vulnerable
  seen: event-stream 3.3.6, November 2018 (a new maintainer added flatmap-stream, which stole wallet keys)
  files:
    package.json: |
      {
        "name": "tools",
        "devDependencies": {
          "event-stream": "3.3.6"
        }
      }

- id: dep-vulnerable-smallvec
  rule: deps/vulnerable
  seen: CVE-2021-25900 (RUSTSEC-2021-0003), a buffer overflow in SmallVec::insert_many
  files:
    Cargo.toml: |
