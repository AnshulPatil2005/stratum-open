# ── names a PR removes that are still used ───────────────────────────────
# The rule is off by default: run with
# --policy benchmark/planted/variants/removed-names.yml.
# Here a case is a change, not new files: `repo` is the default branch, and a
# file of `files` that `repo` has too is that file after the PR. The PR takes
# a name out of a module, and a file it leaves alone (or doesn't fix) still
# imports or uses it. The controls are PRs the rule must leave alone, one for
# each reason it stays quiet.

