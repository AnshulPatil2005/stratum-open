      name = "parser"
      version = "0.1.0"

      [dependencies]
      smallvec = "=1.6.0"

- id: dep-vulnerable-jwt-go
  rule: deps/vulnerable
  seen: CVE-2020-26160, an audience check in jwt-go that could be bypassed; this module never got a fixed release
  files:
