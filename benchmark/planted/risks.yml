# Risks planted for the checks that need no model. Each case is a set of new
# files a PR adds, and `rule` is what should catch it (any one of a list).
# Shaped after real incidents where there was one (`seen`). Nothing here is
# changed to make a case pass: a miss stays in as a miss. A case marked
# `control: true` is files its rule must leave alone.
#
# Secrets aren't stored here: `<<fake:kind>>` is replaced by a random value of
# that shape when the benchmark runs, so this file never holds anything a
# secret scanner would flag. `<<U+XXXX>>` is that Unicode character, so the
# hidden characters are visible here.

