# ── GitHub workflows ─────────────────────────────────────────────────────

- id: wf-pwn-request
  rule: workflow/pwn-request
  seen: the "pwn request" pattern GitHub Security Lab describes; many projects
  files:
    .github/workflows/preview.yml: |
      name: Preview
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
            - run: npm ci && npm run build

- id: wf-branch-name-injection
  rule: [workflow/script-injection, workflow/pwn-request]
  seen: Ultralytics, December 2024 (a branch name ran code in a pull_request_target job)
  files:
    .github/workflows/format.yml: |
      name: Format
      on: pull_request_target
      jobs:
        format:
          runs-on: ubuntu-latest
          steps:
            - run: |
                git fetch origin ${{ github.head_ref }}
                git checkout ${{ github.head_ref }}

- id: wf-issue-title-injection
  rule: workflow/script-injection
  files:
    .github/workflows/triage.yml: |
      name: Triage
      on:
        issues:
          types: [opened]
      jobs:
        label:
          runs-on: ubuntu-latest
          steps:
            - run: echo "New issue: ${{ github.event.issue.title }}"

- id: wf-write-all
  rule: workflow/write-all
  files:
    .github/workflows/ci.yml: |
      name: CI
      on: [push, pull_request]
      permissions: write-all
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: make test

- id: wf-unpinned-third-party
  rule: workflow/unpinned-action
  seen: tj-actions/changed-files, March 2025 (its tags were moved to a malicious commit)
  files:
    .github/workflows/changed.yml: |
      name: Changed files
      on: pull_request
      jobs:
        changed:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: tj-actions/changed-files@v45
            - run: echo done

- id: wf-self-hosted-pr
  rule: workflow/self-hosted-pr
  seen: PyTorch, 2024 (self-hosted runners reachable from fork PRs)
  files:
    .github/workflows/gpu.yml: |
      name: GPU tests
      on: pull_request
      jobs:
        gpu:
          runs-on: [self-hosted, gpu]
          steps:
            - uses: actions/checkout@v4
            - run: pytest tests/gpu

- id: wf-write-on-target
  rule: [workflow/write-permission, workflow/pull-request-target]
  files:
    .github/workflows/label.yml: |
      name: Label
      on: pull_request_target
      permissions:
        contents: write
        pull-requests: write
      jobs:
        label:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/labeler@v5

