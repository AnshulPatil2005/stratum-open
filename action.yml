name: Stratum Open
description: PR review and triage for maintainers, on a model you run yourself. Nothing is sent to Stratum.
author: Anshul Patil
branding:
  icon: layers
  color: purple

inputs:
  github-token:
    description: Token for reading the PR and posting the review. The default works with the permissions in the example workflow.
    default: ${{ github.token }}
  ollama-model:
    description: >-
      Run this model with Ollama on the runner itself, e.g. qwen2.5-coder:7b (the example's), or gpt-oss:20b with
      review.reasoning: low and review.verify: strict in .stratum/policy.yml, which finds far more but is a 13.8 GB
      download each run. No
      server needed. Leave empty to use the endpoint in .stratum/policy.yml (or model-endpoint).
    default: ""
  model-endpoint:
    description: An OpenAI-compatible endpoint to use instead of the policy file's, e.g. a GPU box your project runs.
    default: ""
  model-name:
    description: The model to ask at that endpoint, instead of the policy file's.
    default: ""
  model-api-key:
    description: API key for the endpoint, if it needs one. Pass it from a secret.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install Stratum Open
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Does this event need the model?
      # Comment commands like triage and record don't, so they skip starting Ollama.
      id: need
      shell: bash
      run: echo "model=$(stratum-open needs-model)" >> "$GITHUB_OUTPUT"

    - name: Post the checks first
      # Only with review.early_checks: true in .stratum/policy.yml; otherwise it reads the policy and stops.
      # Before the model is restored and started, so the checks' findings land within a minute.
      id: early
      if: steps.need.outputs.model == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        STRATUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        STRATUM_MODEL_ENDPOINT: ${{ inputs.ollama-model != '' && 'http://localhost:11434/v1' || inputs.model-endpoint }}
        STRATUM_JOB_NAME: ${{ github.job }}
        STRATUM_MODEL_NAME: ${{ inputs.ollama-model != '' && inputs.ollama-model || inputs.model-name }}
        STRATUM_MODEL_API_KEY: ${{ inputs.model-api-key }}
      run: stratum-open action --early

    - name: Cache Ollama and the model
      if: inputs.ollama-model != '' && steps.need.outputs.model == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.stratum-ollama
        key: stratum-ollama-${{ runner.os }}-${{ runner.arch }}-0.40.13-${{ inputs.ollama-model }}

    - name: Start Ollama
      if: inputs.ollama-model != '' && steps.need.outputs.model == 'true'
      shell: bash
      env:
        MODEL: ${{ inputs.ollama-model }}
      # Installs Ollama into the cached folder if it isn't there, makes room on the
      # disk for a model that needs it, and keeps one too big for the cache out of it.
      run: bash "$GITHUB_ACTION_PATH/scripts/start-ollama.sh" "$MODEL"

    - name: Review
      id: review
      shell: bash
      env:
        STRATUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        STRATUM_MODEL_ENDPOINT: ${{ inputs.ollama-model != '' && 'http://localhost:11434/v1' || inputs.model-endpoint }}
        STRATUM_JOB_NAME: ${{ github.job }}
        # On the runner's CPU, a 7B model reads ~20 tokens a second, so calls stay at
        # 8k tokens to finish inside the 15-minute call limit. Your policy file's
        # review.context_tokens wins over this.
        STRATUM_CONTEXT_TOKENS: ${{ inputs.ollama-model != '' && '8192' || '' }}
        STRATUM_MODEL_NAME: ${{ inputs.ollama-model != '' && inputs.ollama-model || inputs.model-name }}
        STRATUM_MODEL_API_KEY: ${{ inputs.model-api-key }}
        STRATUM_EARLY_CHECK_RUN: ${{ steps.early.outputs.check-run }}
        STRATUM_EARLY_CONCLUSION: ${{ steps.early.outputs.conclusion }}
      run: stratum-open action

    - name: Say the model's review didn't finish
      # The checks went up first, and the review never replaced them: Ollama didn't start, or the
      # review failed, timed out or was cancelled. The summary and the check run say so.
      if: always() && steps.early.outputs.posted == 'true' && steps.review.outcome != 'success'
      shell: bash
      env:
        STRATUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        STRATUM_EARLY_CHECK_RUN: ${{ steps.early.outputs.check-run }}
        STRATUM_EARLY_CONCLUSION: ${{ steps.early.outputs.conclusion }}
      run: stratum-open action --stopped
