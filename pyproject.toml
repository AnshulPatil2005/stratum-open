[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stratum-open"
version = "0.2.0"
description = "PR review and triage for open-source maintainers, on a model you run yourself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31", "ftfy>=6.1"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Anshul Patil" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Source = "https://github.com/stratum-org/stratum-open"

[project.scripts]
stratum-open = "stratum_open.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["PyJWT[crypto]>=2.8"]
bandit = ["bandit>=1.7"]

[tool.setuptools]
packages = ["stratum_open", "stratum_open.checks", "stratum_open.repo", "stratum_open.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live end-to-end tests need a real model; `pytest -m live` runs them (they skip, not fail, without one).
addopts = "-m 'not live'"
markers = [
    "e2e: end-to-end tests against the fake model and fake GitHub servers (tests/e2e)",
    "live: needs a real model server at STRATUM_MODEL_ENDPOINT (default: Ollama on localhost)",
    "slow: takes more than a few seconds",
]
