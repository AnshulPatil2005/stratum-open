# Copy to .github/workflows/stratum.yml in your repo.
#
# It runs on pull_request_target so it can comment on PRs from forks. That's
# safe here because the workflow checks out your default branch, never the
# PR, and Stratum reads the PR only through the API: no code from the PR runs.
# Don't add a step that checks out or runs the PR's code.
name: Stratum

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Optional: re-sort a PR when your CI finishes, so its label sees the result.
  # Name your CI workflows here. (GitHub leaves fork PRs out of these events.)
  # workflow_run:
  #   workflows: [tests]
  #   types: [completed]
  schedule:
    - cron: "17 6 * * *"  # rebuild the triage queue issue once a day
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  stratum:
    # A comment starts the job only if it might hold a command: "/stratum " (with the
    # space, so a link to stratum-org/stratum-open doesn't).
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      contains(github.event.comment.body, '/stratum ')
    runs-on: ubuntu-latest
    # On the job, not the workflow, so a comment without a command never joins
    # a group: GitHub keeps one pending run per group and cancels the others,
    # which lost queued commands. A new push cancels the review of the old one;
    # each command gets a group of its own, so none is dropped.
    concurrency:
      group: stratum-${{ github.event_name == 'pull_request_target' && format('review-{0}', github.event.pull_request.number) || github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    timeout-minutes: 60
    steps:
      # The default branch, with history for track records, ownership and hotspots.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Pin to a commit SHA (stratum-org/stratum-open@<sha>) so a new release reaches you only when you choose.
      - uses: stratum-org/stratum-open@v0.2.0
        with:
          # Runs the model on the runner: no server needed, but slow on CPU.
          # For reviews that find far more, use gpt-oss:20b and set review.reasoning: low
          # and review.verify: strict in .stratum/policy.yml (a 13.8 GB download each run;
          # see "Models" in the README).
          # To use your own server instead, remove this line and set
          # review.endpoint in .stratum/policy.yml (or model-endpoint here).
          ollama-model: qwen2.5-coder:7b
