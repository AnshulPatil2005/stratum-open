# The planted-bug benchmark (benchmark/planted.py) on GitHub's free runners
# (4 CPUs, no GPU), the machine the Action reviews on. Each model's 40 cases
# are split across `shards` jobs, since a 14B model takes about 10 minutes a
# PR on a CPU. Start it by hand from the Actions tab; the results come back
# as the planted-results artifact, to mark by hand and commit under
# benchmark/results/.
#
# hosted-model adds one model on an OpenAI-compatible API as a reference,
# with its key in the STRATUM_EVAL_API_KEY secret: a key kept for
# evaluations, with a spending limit, never a production one.
name: Planted-bug benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: Ollama models to compare, separated by spaces, or none (GitHub fills an empty field with the default)
        default: qwen2.5-coder:1.5b qwen2.5-coder:3b qwen2.5-coder:7b qwen2.5-coder:14b
      shards:
        description: Jobs per model
        default: "8"
      hosted-model:
        description: A hosted model to compare too (empty for none), e.g. qwen/qwen3-coder
        default: ""
      hosted-endpoint:
        description: Its OpenAI-compatible endpoint
        default: https://openrouter.ai/api/v1

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODELS: ${{ inputs.models }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          shards = int(os.environ["SHARDS"])
          jobs = [{"model": m, "safe": re.sub(r"[^A-Za-z0-9.-]", "-", m), "shard": k, "of": shards}
                  for m in os.environ["MODELS"].split() if m != "none" for k in range(1, shards + 1)]
          print("matrix=" + json.dumps({"include": jobs}))
          EOF

  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - name: Fetch the PRs once, for every job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python benchmark/planted.py fetch --bugs benchmark/planted/bugs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
          include-hidden-files: true
          retention-days: 1

  review:
    needs: [plan, fetch]
    if: inputs.models != 'none'  # an empty matrix is an error; hosted-model alone is a valid run
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
      - name: Start Ollama and pull the model
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          root="$HOME/ollama"
          mkdir -p "$root"
          curl -fsSL -o "$RUNNER_TEMP/ollama.tar.zst" "https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst"
          echo "c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -x -C "$root" -f "$RUNNER_TEMP/ollama.tar.zst"
          OLLAMA_NUM_PARALLEL=1 nohup "$root/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/version > /dev/null && break; sleep 1; done
          "$root/bin/ollama" pull "$MODEL"
      - name: Review this shard's cases
        env:
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          OUT: raw/${{ matrix.safe }}-${{ matrix.shard }}
        run: python benchmark/planted.py run --bugs benchmark/planted/bugs.json --model "$MODEL@http://localhost:11434/v1" --shard "$SHARD" --out "$OUT"
      - if: always()
        run: tail -n 50 "$RUNNER_TEMP/ollama.log" || true
      - if: always()  # a stopped shard's partial results are still worth keeping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.safe }}-${{ matrix.shard }}
          path: raw/${{ matrix.safe }}-${{ matrix.shard }}/
          if-no-files-found: ignore

  hosted:
    needs: fetch
    if: inputs.hosted-model != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
      - name: Review every case with the hosted model
        env:
          STRATUM_MODEL_API_KEY: ${{ secrets.STRATUM_EVAL_API_KEY }}
          MODEL: ${{ inputs.hosted-model }}
          ENDPOINT: ${{ inputs.hosted-endpoint }}
        run: |
          if [ -z "$STRATUM_MODEL_API_KEY" ]; then echo "::error::Add the STRATUM_EVAL_API_KEY secret first."; exit 1; fi
          python benchmark/planted.py run --bugs benchmark/planted/bugs.json --model "$MODEL@$ENDPOINT" --out raw/hosted
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-hosted
          path: raw/hosted/
          if-no-files-found: ignore

  collect:
    needs: [review, hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results/raw/
      - name: Score
        run: |
          python benchmark/planted.py score results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planted-results
          path: results/
