# The planted-bug benchmark (benchmark/planted.py) on GitHub's free runners
# (4 CPUs, no GPU), the machine the Action reviews on. Each model's cases, with
# the bug and (with `clean`) without it, are split across `shards` jobs, since a 14B model takes about 10 minutes a
# PR on a CPU. Start it by hand from the Actions tab; the results come back
# as the planted-results artifact, to mark by hand and commit under
# benchmark/results/.
#
# hosted-model adds one model on an OpenAI-compatible API as a reference,
# with its key in the STRATUM_EVAL_API_KEY secret: a key kept for
# evaluations, with a spending limit, never a production one.
name: Planted-bug benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: Ollama models to compare, separated by spaces, or none (GitHub fills an empty field with the default)
        default: qwen2.5-coder:1.5b qwen2.5-coder:3b qwen2.5-coder:7b qwen2.5-coder:14b
      shards:
        description: Jobs per model
        default: "8"
      hosted-model:
        description: A hosted model to compare too (empty for none), e.g. qwen/qwen3-coder
        default: ""
      hosted-endpoint:
        description: Its OpenAI-compatible endpoint
        default: https://openrouter.ai/api/v1
      bugs:
        description: The case file, e.g. benchmark/planted/bugs-2.json for the second set of bug kinds
        default: benchmark/planted/bugs.json
      set:
        description: Which cases (all | dev | test); tune on dev, report test
        default: all
      clean:
        description: Also review each PR as merged, without the bug (the control)
        type: boolean
        default: true
      policy:
        description: A policy file in the repo merged over the Action's settings, e.g. benchmark/planted/variants/verify.yml (empty for none)
        default: ""
      other-tool:
        description: Another reviewer to run on the same cases, models and shards (pr-agent; empty for none), see benchmark/others/README.md
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODELS: ${{ inputs.models }}
          SHARDS: ${{ inputs.shards }}
          CLEAN: ${{ inputs.clean }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          shards = int(os.environ["SHARDS"])
          versions = ["planted", "clean"] if os.environ["CLEAN"] == "true" else ["planted"]
          jobs = [{"model": m, "safe": re.sub(r"[^A-Za-z0-9.-]", "-", m), "version": v, "shard": k, "of": shards}
                  for m in os.environ["MODELS"].split() if m != "none" for v in versions for k in range(1, shards + 1)]
          print("matrix=" + json.dumps({"include": jobs}))
          EOF

  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - name: Fetch the PRs once, for every job
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUGS: ${{ inputs.bugs }}
        run: python benchmark/planted.py fetch --bugs "$BUGS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
          include-hidden-files: true
          retention-days: 1

  review:
    needs: [plan, fetch]
    if: inputs.models != 'none'  # an empty matrix is an error; hosted-model alone is a valid run
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
      - name: Start Ollama and pull the model
        # The Action's own setup script, so a benchmark run also tests it.
        env:
          MODEL: ${{ matrix.model }}
          STRATUM_OLLAMA_ROOT: ${{ runner.temp }}/ollama
        run: bash scripts/start-ollama.sh "$MODEL"
      - name: Review this shard's cases
        env:
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          VERSION: ${{ matrix.version }}
          BUGS: ${{ inputs.bugs }}
          SET: ${{ inputs.set }}
          POLICY: ${{ inputs.policy }}
          OUT: raw/${{ matrix.safe }}-${{ matrix.version }}-${{ matrix.shard }}
        run: |
          args=(--bugs "$BUGS" --model "$MODEL@http://localhost:11434/v1" --shard "$SHARD" --set "$SET" --out "$OUT")
          if [ "$VERSION" = clean ]; then args+=(--clean); fi
          if [ -n "$POLICY" ]; then args+=(--policy "$POLICY" --variant "$(basename "$POLICY" .yml)"); fi
          python benchmark/planted.py run "${args[@]}"
      - if: always()
        run: tail -n 50 "$RUNNER_TEMP/ollama.log" || true
      - name: Memory
        # What Ollama found free, the peak memory of the biggest process (the model's), and any out-of-memory kill.
        if: always()
        run: |
          grep -E 'inference compute|system memory|of system memory|cache state' "$RUNNER_TEMP/ollama.log" | tail -n 6 || true
          pid=$(ps -eo pid --sort=-rss --no-headers | head -n 1 | tr -d ' ')
          ps -o comm= -p "$pid" || true
          grep -E 'VmHWM|VmRSS|VmSwap' "/proc/$pid/status" || true
          free -m
          sudo dmesg | grep -i -E 'out of memory|killed process' || echo "No out-of-memory kill"
      - if: always()  # a stopped shard's partial results are still worth keeping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.safe }}-${{ matrix.version }}-${{ matrix.shard }}
          path: raw/${{ matrix.safe }}-${{ matrix.version }}-${{ matrix.shard }}/
          if-no-files-found: ignore

  hosted:
    needs: fetch
    if: inputs.hosted-model != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
      - name: Review every case with the hosted model
        env:
          STRATUM_MODEL_API_KEY: ${{ secrets.STRATUM_EVAL_API_KEY }}
          MODEL: ${{ inputs.hosted-model }}
          ENDPOINT: ${{ inputs.hosted-endpoint }}
          CLEAN: ${{ inputs.clean }}
          BUGS: ${{ inputs.bugs }}
          SET: ${{ inputs.set }}
          POLICY: ${{ inputs.policy }}
        run: |
          if [ -z "$STRATUM_MODEL_API_KEY" ]; then echo "::error::Add the STRATUM_EVAL_API_KEY secret first."; exit 1; fi
          args=(--bugs "$BUGS" --model "$MODEL@$ENDPOINT" --set "$SET")
          if [ -n "$POLICY" ]; then args+=(--policy "$POLICY" --variant "$(basename "$POLICY" .yml)"); fi
          python benchmark/planted.py run "${args[@]}" --out raw/hosted/planted
          if [ "$CLEAN" = true ]; then python benchmark/planted.py run "${args[@]}" --clean --out raw/hosted/clean; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-hosted
          path: raw/hosted/
          if-no-files-found: ignore

  other:
    # PR-Agent on the same cases, model and kind of runner, for a head-to-head (benchmark/others/README.md).
    # It runs next to `review`, with the same shards, and its results are scored with stratum-open's.
    needs: [plan, fetch]
    if: inputs.other-tool == 'pr-agent' && inputs.models != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NAME: pr-agent-${{ matrix.safe }}-${{ matrix.version }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - name: Install PR-Agent in an environment of its own
        # The release benchmark/others/pr_agent.py is written for (it refuses another), and what pip resolved with it.
        run: |
          python -m venv "$RUNNER_TEMP/pr-agent"
          "$RUNNER_TEMP/pr-agent/bin/python" -m pip install --quiet pr-agent==0.50.0
          mkdir -p "trace/$NAME"
          "$RUNNER_TEMP/pr-agent/bin/python" -m pip freeze > "trace/$NAME/packages.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-cache
          path: benchmark/.cache/
      - name: Start Ollama and pull the model
        env:
          MODEL: ${{ matrix.model }}
          STRATUM_OLLAMA_ROOT: ${{ runner.temp }}/ollama
          # PR-Agent's requests name no context window, so the server is started with stratum-open's,
          # as PR-Agent's documentation says to. The runner stops if the model isn't loaded with it.
          OLLAMA_CONTEXT_LENGTH: "8192"
        run: bash scripts/start-ollama.sh "$MODEL"
      - name: Review this shard's cases with PR-Agent
        env:
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          VERSION: ${{ matrix.version }}
          SET: ${{ inputs.set }}
          POLICY: ${{ inputs.policy }}
        run: |
          args=(--bugs benchmark/planted/bugs.json --model "$MODEL@http://localhost:11434" --pr-agent "$RUNNER_TEMP/pr-agent/bin/python"
                --context-tokens 8192 --shard "$SHARD" --set "$SET" --out "raw/$NAME" --trace "trace/$NAME")
          if [ "$VERSION" = clean ]; then args+=(--clean); fi
          if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi
          python benchmark/others/pr_agent.py "${args[@]}"
      - if: always()
        run: tail -n 50 "$RUNNER_TEMP/ollama.log" || true
      - if: always()  # a stopped shard's partial results are still worth keeping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ env.NAME }}
          path: raw/${{ env.NAME }}/
          if-no-files-found: ignore
      - if: always()  # every prompt PR-Agent sent, the replies and its logs: kept apart, so the results stay small
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-${{ env.NAME }}
          path: trace/${{ env.NAME }}/
          if-no-files-found: ignore

  collect:
    needs: [review, hosted, other]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results/raw/
      - name: Score
        run: |
          python benchmark/planted.py score results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planted-results
          path: results/
